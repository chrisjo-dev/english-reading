<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>릴리랑 | 2분 영어 그림책</title>
<meta name="description" content="아이와 함께 2분, 듣고 누르며 노는 영어 그림책. 4~7세 아이와 부모님을 위한 릴리랑.">
<link rel="icon" href="brand/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&display=swap"></noscript>
<style>
/* EP03 페이지와 같은 그림책(t-book) 색. 이 페이지에는 누르는 장난감이 없어서 노랑(--touch)은 쓰지 않는다 */
:root {
  --t-bg: #eaf2f7; --t-surface: #ffffff; --t-ink: #24323d; --t-sub: #5b6b78; --t-accent: #2f7d6d; --t-soft: #d7ebe4;
  --t-wash-1: #bfe0f2; --t-wash-2: #ffd6c2;
  --kr: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --en: "Andika", "Gowun Dodum", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--t-bg); color: var(--t-ink); font-family: var(--kr); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--t-accent); outline-offset: 2px; }
main {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.hero { text-align: center; padding: 8px 8px 4px; }
.hero img { display: block; width: 150px; height: auto; margin: 0 auto 10px; }
.hero h1 { margin: 0; font-size: 21px; font-weight: 400; line-height: 1.45; }
.who { display: inline-block; margin-top: 10px; padding: 3px 14px; border-radius: 99px; background: var(--t-soft); color: var(--t-accent); font-size: 14px; }
.card { background: var(--t-surface); border-radius: 20px; padding: 20px; }
h2 { margin: 0 0 12px; font-size: 18px; font-weight: 400; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
.steps .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--t-wash-1); font-family: var(--en); font-weight: 700; color: var(--t-ink); }
.steps b { display: block; font-weight: 400; font-size: 16px; }
.steps span span { font-size: 14px; color: var(--t-sub); }
.ep { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; text-decoration: none; color: inherit; border-radius: 16px; padding: 10px; background: var(--t-bg); }
.ep img { width: 112px; height: 112px; object-fit: cover; object-position: center 20%; border-radius: 12px; display: block; background: var(--t-wash-1); }
.ep .no { font-family: var(--en); font-weight: 700; font-size: 12px; color: var(--t-accent); }
.ep .tt { display: block; font-family: var(--en); font-weight: 700; font-size: 20px; line-height: 1.25; margin: 2px 0 4px; }
.ep .meta { font-size: 14px; color: var(--t-sub); }
.ep .go { display: inline-block; margin-top: 8px; font-size: 14px; color: var(--t-accent); }
.ep:active { background: var(--t-soft); }
.soon { margin: 12px 0 0; font-size: 14px; color: var(--t-sub); }
.maker { margin: 8px 4px 0; font-size: 13px; text-align: center; }
.maker a { color: var(--t-accent); }
</style>
</head>
<body>
<main>
  <header class="hero">
    <img src="brand/logo-v.svg" width="275" height="332" alt="릴리랑 2분 영어 그림책" fetchpriority="high">
    <h1>아이와 함께 2분, 듣고 누르며 노는 영어 그림책</h1>
    <span class="who">4~7세 아이와 부모님</span>
  </header>

  <section class="card" aria-labelledby="h-how">
    <h2 id="h-how">이렇게 놀아요</h2>
    <ol class="steps">
      <li><span class="n">1</span><span><b>듣기</b><span>릴리 이야기를 2분 동안 같이 들어요.</span></span></li>
      <li><span class="n">2</span><span><b>누르며 놀기</b><span>릴리가 기다리면 그림을 눌러요. 누르면 이야기가 이어져요.</span></span></li>
      <li><span class="n">3</span><span><b>학습지</b><span>인쇄해서 그림 찾기, 단어 카드, 스티커를 같이 해요.</span></span></li>
    </ol>
  </section>

  <section class="card" aria-labelledby="h-eps">
    <h2 id="h-eps">이야기</h2>
    <a class="ep" href="ep03/">
      <img src="ep03/art/bg-0-intro.webp" width="112" height="112" alt="" loading="lazy" decoding="async">
      <span>
        <span class="no">EP03</span>
        <span class="tt">Brush, Brush, Brush!</span>
        <span class="meta">이 닦기, 2분</span><br>
        <span class="go">들으러 가기</span>
      </span>
    </a>
    <p class="soon">새 이야기가 곧 나와요.</p>
  </section>

  <p class="maker"><a href="/">릴리랑은 매일 외국어 읽기가 만들어요</a></p>
</main>
</body>
</html>
