# 예약 작업이 content/<언어>/YYYY-MM-DD.json 을 push 하면
# 음성, 페이지, 썸네일을 만들어 커밋하고, 배포된 페이지가 열리면 그 언어 구독자에게 메일을 보낸다.
name: publish

on:
  push:
    branches: [main]
    # de 콘텐츠는 de-audio.yml 이 음성을 먼저 만들고 publish 를 dispatch 한다.
    # push 에서 de 를 직접 받으면 음성 없이 페이지가 빌드되므로 여기서 제외한다.
    paths:
      - "content/en/**.json"
      - "content/ja/**.json"
  workflow_dispatch:
    inputs:
      lang:
        description: "언어 코드 (en, ja, de)"
        required: true
        default: en
      day:
        description: "YYYY-MM-DD"
        required: true
      send:
        description: "오늘 날짜가 아니어도 메일 발송"
        type: boolean
        default: false
      no_email:
        description: "오늘 날짜여도 메일 보내지 않기 (이미 보낸 오늘 지문을 고쳐 다시 만들 때)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # 일본어 음성 엔진(VOICEVOX). 영어만 올라온 날에도 같이 뜨지만 쓰지 않는다.
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          ref: main

      - name: Pick language and day
        id: pick
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            pairs="${{ inputs.lang }}:${{ inputs.day }}"
          else
            # 한 번에 여러 커밋이 push돼도 놓치지 않도록 push 직전 커밋과 비교한다.
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            git cat-file -e "$base" 2>/dev/null || base="${head}^"
            # HEAD 가 아닌 트리거 커밋(head)까지만 비교해 이 push 의 변경만 잡는다.
            # 경로를 content/ 전체로 잡아야 파일 이동(R)을 추가(A)로 오인하지 않는다.
            pairs=$(git diff --name-only --diff-filter=AM -M "$base" "$head" -- content/ \
              | sed -nE 's#^content/([a-z]+)/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$#\1:\2#p' | sort -u | tr '\n' ' ')
          fi
          [ -n "${pairs// /}" ] || { echo "no content change"; exit 1; }
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          echo "publishing: $pairs"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow kokoro-onnx soundfile
          # VOICEVOX 엔진이 준비될 때까지 기다린다(최대 5분).
          for i in $(seq 1 60); do curl -sf http://localhost:50021/version && break; sleep 5; done

      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Check content
        # 화면에 그대로 보일 마크다운 기호와 출처 없는 수치를 주석으로 드러낸다. 발행은 막지 않는다.
        continue-on-error: true
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            python tools/check_content.py "${pair%%:*}" "${pair#*:}"
          done

      - name: Guard recent overlap
        # 최근 14일 지문과 같은 이야기를 반복하면(같은 기사, 형광펜 단어 2개 이상, 본문 12% 이상 겹침) 그대로 내보내지 않는다.
        # 오늘 지문이면 비축분으로 바꿔 발행을 이어 가고 이슈로 알린다. 비축분이 없으면 원래 지문을 내보내고 알린다(메일이 끊기지 않게).
        # 지난 날짜면 여기서 멈춘다.
        run: |
          swapped=""
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            if python tools/check_content.py --overlap "$lang" "$day" > /tmp/overlap.txt; then cat /tmp/overlap.txt; continue; fi
            cat /tmp/overlap.txt
            if [ "$day" != "${{ steps.pick.outputs.today }}" ]; then
              echo "::error::$pair 이 최근 지문과 겹쳐 발행을 멈춥니다. 지문을 고쳐 다시 올려 주세요."; exit 1
            fi
            git rm -q "content/$lang/$day.json"
            out=$(python tools/fallback.py --lang "$lang" --day "$day") || true
            echo "$out"
            case "$out" in
              USED*)
                swapped="$swapped $pair"
                title="[겹침 교체] $lang $day"
                head="오늘 $lang 지문이 최근 지문과 겹쳐 비축분으로 바꿔 발행했습니다. 교체: $out. 원래 지문은 git log -- content/$lang/$day.json 에 남아 있습니다." ;;
              *)
                # 바꿀 비축분이 없으면 메일이 끊기지 않게 원래 지문을 그대로 발행하고 알리기만 한다
                git checkout -q HEAD -- "content/$lang/$day.json"
                title="[겹침 경고] $lang $day"
                head="오늘 $lang 지문이 최근 지문과 겹치지만 바꿀 비축분이 없어 원래 지문을 그대로 발행했습니다. 비축분을 보충해 주세요." ;;
            esac
            { echo "@chrisjo-dev $head"; echo; echo '```'; cat /tmp/overlap.txt; echo '```'; } > /tmp/overlap_issue.txt
            gh issue create --title "$title" --body-file /tmp/overlap_issue.txt || true
          done
          echo "swapped=$swapped"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Audio (level b)
        # 중급 음성은 필수다. 3번까지 다시 시도하고, 그래도 실패하면 여기서 멈춰 메일을 보내지 않는다.
        # tts=="qwen" 언어(독일어)는 아직 자동 생성 경로가 확정되지 않아 건너뛴다. 페이지는 SpeechSynthesis de-DE 폴백으로 동작한다.
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            tts_engine=$(python -c "import sys; sys.path.insert(0,'tools'); import langs; print(langs.LANGS.get('$lang',{}).get('tts','kokoro'))")
            if [ "$tts_engine" = "qwen" ]; then
              echo "::warning::${lang} 음성은 별도 경로로 생성합니다 (tts=qwen). 이 실행에서는 건너뜁니다. 페이지는 SpeechSynthesis 폴백으로 동작합니다."
              continue
            fi
            ok=
            for i in 1 2 3; do
              [ -f models/kokoro-v1.0.int8.onnx ] || curl -sSfL --retry 3 -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx || rm -f models/kokoro-v1.0.int8.onnx
              [ -f models/voices-v1.0.bin ] || curl -sSfL --retry 3 -o models/voices-v1.0.bin $base/voices-v1.0.bin || rm -f models/voices-v1.0.bin
              if python tools/audio.py $lang $day models --level b; then ok=1; break; fi
              echo "audio b attempt $i failed for $pair"; sleep 20
            done
            [ -n "$ok" ] || exit 1
          done

      - name: Audio (level a)
        # 기초 음성 실패는 경고만 남기고 계속 진행한다. 중급 오디오와 이메일에는 영향 없음.
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            python tools/audio.py $lang $day models --level a || echo "::warning::level a audio failed for $pair"
          done

      - name: Audio (word pronunciation)
        # 단어 발음 음성 실패는 경고만 남기고 계속 진행한다. 문장 음성, 렌더링, 이메일에는 영향 없음.
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            python tools/audio.py $lang $day models --level w || echo "::warning::word audio (w) failed for $pair"
            python tools/audio.py $lang $day models --level v || echo "::warning::word audio (v) failed for $pair"
          done

      - name: Build pages
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            python tools/render.py ${pair%%:*} ${pair#*:}
            python tools/publish.py ${pair%%:*} ${pair#*:}
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # models/ 는 .gitignore 로 제외된다
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Publish ${{ steps.pick.outputs.pairs }}"
          # 최대 3회 재시도: 거절되면 origin/main 으로 rebase 하고 생성 파일 충돌은 재생성으로 해결한다.
          push_ok=0
          for attempt in 1 2 3; do
            if git push; then push_ok=1; break; fi
            echo "push attempt $attempt failed; rebasing onto origin/main..."
            git fetch origin main
            if git rebase origin/main; then continue; fi
            # rebase 충돌: 생성 파일만 허용한다 (langs 기반으로 동적 구성)
            _all_langs=$(python -c "import sys; sys.path.insert(0,'tools'); import langs; print(' '.join(langs.LANGS))")
            _pat='latest\.json|sitemap\.xml|robots\.txt'
            _add_list='latest.json sitemap.xml robots.txt'
            for _l in $_all_langs; do
              _pat="$_pat|${_l}/index\.html|${_l}/archive/index\.html"
              _add_list="$_add_list ${_l}/index.html ${_l}/archive/index.html"
            done
            bad=$(git diff --name-only --diff-filter=U | grep -vxE "$_pat" || true)
            if [ -n "$bad" ]; then
              git rebase --abort
              echo "::error::생성 파일 외 rebase 충돌: $bad — 수동 해결 필요"
              exit 1
            fi
            python -c "import sys; sys.path.insert(0,'tools'); import langs, publish; publish.rebuild_root(); [publish.rebuild_lists(c) for c in langs.LANGS]"
            # shellcheck disable=SC2086
            git add -- $_add_list 2>/dev/null || true
            # 생성 파일만 변경된 커밋은 rebase 후 공백 패치가 될 수 있다 -> --skip
            if git diff --cached --quiet; then
              git rebase --skip
            else
              GIT_EDITOR=: git rebase --continue || { echo "::error::rebase --continue 실패"; git rebase --abort 2>/dev/null || true; exit 1; }
            fi
          done
          [ $push_ok -eq 1 ] || { echo "::error::push 3회 모두 실패"; exit 1; }
          # GITHUB_TOKEN 으로 한 push 는 Pages 빌드를 보장하지 않으므로 직접 요청한다.
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Send email
        # 지난 날짜를 다시 만들 때는 보내지 않는다(수동 실행에서 send 를 켠 경우만 예외). no_email 이면 오늘 날짜여도 보내지 않는다.
        # 중급(b)을 먼저 발송한다. 실패하면 워크플로 중단. 기초(a) 발송 실패는 경고만 남기고 계속 진행.
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            if [ "${{ inputs.no_email }}" = "true" ]; then
              echo "skip email for $pair (no_email)"
            elif [ "$day" = "${{ steps.pick.outputs.today }}" ] || [ "${{ inputs.send }}" = "true" ]; then
              python tools/send_email.py $lang $day --level b
              # level a 는 levels 플래그가 True 인 언어(현재 영어)만. send_email.py 도 email 플래그를 확인한다.
              _has_levels=$(python -c "import sys; sys.path.insert(0,'tools'); import langs; print(langs.LANGS.get('$lang',{}).get('levels',False))")
              if [ "$_has_levels" = "True" ]; then
                python tools/send_email.py $lang $day --level a || echo "::warning::level a email skipped for $pair"
              fi
            else
              echo "skip email for $pair (not today)"
            fi
          done
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
