# 예약 작업이 content/<언어>/YYYY-MM-DD.json 을 push 하면
# 음성, 페이지, 썸네일을 만들어 커밋하고, 배포된 페이지가 열리면 그 언어 구독자에게 메일을 보낸다.
name: publish

on:
  push:
    branches: [main]
    paths: ["content/**.json"]
  workflow_dispatch:
    inputs:
      lang:
        description: "언어 코드 (en, ja)"
        required: true
        default: en
      day:
        description: "YYYY-MM-DD"
        required: true
      send:
        description: "오늘 날짜가 아니어도 메일 발송"
        type: boolean
        default: false
      no_email:
        description: "오늘 날짜여도 메일 보내지 않기 (이미 보낸 오늘 지문을 고쳐 다시 만들 때)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # 일본어 음성 엔진(VOICEVOX). 영어만 올라온 날에도 같이 뜨지만 쓰지 않는다.
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Pick language and day
        id: pick
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            pairs="${{ inputs.lang }}:${{ inputs.day }}"
          else
            # 한 번에 여러 커밋이 push돼도 놓치지 않도록 push 직전 커밋과 비교한다.
            base="${{ github.event.before }}"
            git cat-file -e "$base" 2>/dev/null || base=HEAD^
            # 경로를 content/ 전체로 잡아야 파일 이동(R)을 추가(A)로 오인하지 않는다.
            pairs=$(git diff --name-only --diff-filter=AM -M "$base" HEAD -- content/ \
              | sed -nE 's#^content/([a-z]+)/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$#\1:\2#p' | sort -u | tr '\n' ' ')
          fi
          [ -n "${pairs// /}" ] || { echo "no content change"; exit 1; }
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          echo "publishing: $pairs"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow kokoro-onnx soundfile
          # VOICEVOX 엔진이 준비될 때까지 기다린다(최대 5분).
          for i in $(seq 1 60); do curl -sf http://localhost:50021/version && break; sleep 5; done

      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Check content
        # 화면에 그대로 보일 마크다운 기호와 출처 없는 수치를 주석으로 드러낸다. 발행은 막지 않는다.
        continue-on-error: true
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            python tools/check_content.py "${pair%%:*}" "${pair#*:}"
          done

      - name: Audio
        # 음성은 필수다. 3번까지 다시 시도하고, 그래도 실패하면 여기서 멈춰 메일을 보내지 않는다.
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}; ok=
            for i in 1 2 3; do
              [ -f models/kokoro-v1.0.int8.onnx ] || curl -sSfL --retry 3 -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx || rm -f models/kokoro-v1.0.int8.onnx
              [ -f models/voices-v1.0.bin ] || curl -sSfL --retry 3 -o models/voices-v1.0.bin $base/voices-v1.0.bin || rm -f models/voices-v1.0.bin
              if python tools/audio.py $lang $day models; then ok=1; break; fi
              echo "audio attempt $i failed for $pair"; sleep 20
            done
            [ -n "$ok" ] || exit 1
          done

      - name: Build pages
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            python tools/render.py ${pair%%:*} ${pair#*:}
            python tools/publish.py ${pair%%:*} ${pair#*:}
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # models/ 는 .gitignore 로 제외된다
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Publish ${{ steps.pick.outputs.pairs }}"
          git push || { git pull --rebase origin main && git push; }
          # GITHUB_TOKEN 으로 한 push 는 Pages 빌드를 보장하지 않으므로 직접 요청한다.
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Send email
        # 지난 날짜를 다시 만들 때는 보내지 않는다(수동 실행에서 send 를 켠 경우만 예외). no_email 이면 오늘 날짜여도 보내지 않는다.
        run: |
          for pair in ${{ steps.pick.outputs.pairs }}; do
            lang=${pair%%:*}; day=${pair#*:}
            if [ "${{ inputs.no_email }}" = "true" ]; then
              echo "skip email for $pair (no_email)"
            elif [ "$day" = "${{ steps.pick.outputs.today }}" ] || [ "${{ inputs.send }}" = "true" ]; then
              python tools/send_email.py $lang $day
            else
              echo "skip email for $pair (not today)"
            fi
          done
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
