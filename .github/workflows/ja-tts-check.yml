# 일회성 점검: GitHub 실행 환경에서 일본어 음성(Kokoro jf_alpha + misaki ja)이 만들어지는지 확인한다.
name: ja-tts-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile "misaki[ja]" unidic-lite
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: |
          mkdir -p models out
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -sSfL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSfL -o models/voices-v1.0.bin $base/voices-v1.0.bin
          cat > t.py <<'PY'
          import subprocess, soundfile as sf
          from kokoro_onnx import Kokoro
          from misaki import ja
          g2p = ja.JAG2P()
          k = Kokoro("models/kokoro-v1.0.int8.onnx", "models/voices-v1.0.bin")
          print("ja voices:", [v for v in k.get_voices() if v.startswith("j")])
          for i, text in enumerate(["駅の近くに新しいパン屋ができました。", "毎朝七時に起きて、コーヒーを飲みます。"], 1):
              ph, _ = g2p(text)
              print(i, text, "->", ph)
              a, sr = k.create(ph, voice="jf_alpha", speed=0.9, lang="ja", is_phonemes=True)
              sf.write(f"out/s{i}.wav", a, sr)
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", f"out/s{i}.wav", "-ac", "1", "-b:a", "48k", f"out/s{i}.mp3"], check=True)
              print("seconds", round(len(a) / sr, 2))
          PY
          python t.py
      - uses: actions/upload-artifact@v4
        with:
          name: ja-tts
          path: out/*.mp3
