# 독일어 음성(C2: Qwen3-TTS 1.7B CustomVoice, Serena)을 Actions CPU 에서 매일 만들 수 있는지 재는 벤치마크(이슈 #9).
# bench/de-tts 브랜치 push 와 수동 실행에서만 돈다. 비밀값, 메일, 배포와 무관하다.
name: de-tts-bench

on:
  push:
    branches: [bench/de-tts]
  workflow_dispatch:
    inputs:
      threads:
        description: "torch 스레드 수 (비우면 기본값)"
        required: false
        default: ""

permissions:
  contents: read

env:
  MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  HF_HOME: ${{ github.workspace }}/.hf
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/de-tts-bench.yml

      - name: Cache HF models
        id: hfcache
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-${{ env.MODEL_ID }}-whisper-base-v1

      - name: Install
        run: |
          t0=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts==0.1.1 faster-whisper soundfile
          echo "install_sec=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "hf_cache_hit=${{ steps.hfcache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
          nproc; free -g; python -c "import torch; print('torch', torch.__version__, 'threads', torch.get_num_threads())"

      - name: Generate (6 sentences + 3 words)
        env:
          TTS_THREADS: ${{ inputs.threads }}
        run: |
          t0=$(date +%s)
          python tools/tts_qwen.py gen tests/fixtures/de-bench.json out
          echo "gen_step_sec=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh .hf | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Whisper check (tiny, base)
        continue-on-error: true
        run: |
          python tools/tts_qwen.py check tests/fixtures/de-bench.json out --model tiny
          python tools/tts_qwen.py check tests/fixtures/de-bench.json out --model base
          du -sh .hf | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: de-tts-bench-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/
