# 도구, 테스트, 지문을 고친 push 마다 단위 테스트와 지문 검사를 돌린다.
# 실패하면 빨간불로 알려 줄 뿐 발행을 막지는 않는다. 발행 직전 막는 일은 publish 의 Guard 단계가 한다.
name: ci

on:
  push:
    branches: [main]
    paths: ["tools/**", "tests/**", "content/**", "pool/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: pip install -q pytest && python -m pytest -q tests
      - name: Content checks (all published passages, then the reserve pool)
        run: |
          python tools/check_content.py --all
          python tools/check_content.py --pool
