name: resend

# 운영자용: 그날 메일이 잘못 나갔거나 안 나갔을 때 같은 날 지문을 원래 제목 그대로 다시 보낸다. 수동 실행만 한다.
# 같은 실행을 재시도(Re-run)하면 이미 보낸 언어+수준은 건너뛰고, 새로 실행하면 다시 보낸다.
# 본 메일 중복 막기와 08:00 보충 발송에는 섞이지 않는다.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "YYYY-MM-DD"
        required: true
      lang:
        description: "언어 코드, 공백으로 구분 (비우면 모든 언어)"
        required: false
        default: ""
      level:
        description: "수준 (all 이면 기초 a, 중급 b 모두)"
        type: choice
        options: [all, a, b]
        default: all
      note:
        description: "본문 맨 위 안내 한 줄 (비우면 넣지 않음)"
        required: false
        default: ""

concurrency:
  group: resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Resend
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LANG_CODE: ${{ inputs.lang }}
          LEVEL: ${{ inputs.level }}
          DAY: ${{ inputs.day }}
          NOTE: ${{ inputs.note }}
          RUN: ${{ github.run_id }}
        run: |
          codes="$LANG_CODE"
          [ -n "$codes" ] || codes=$(python -c "import sys; sys.path.insert(0, 'tools'); import langs; print(' '.join(langs.LANGS))")
          failed=""
          for code in $codes; do
            levels="$LEVEL"
            [ "$levels" != all ] || levels=$(python -c "import sys; sys.path.insert(0,'tools'); import langs; L=langs.LANGS.get('$code',{}); print('a b' if L.get('levels') else 'b')")
            for level in $levels; do
              python tools/send_email.py "$code" "$DAY" --level "$level" --resend "$RUN" --note "$NOTE" \
                || failed="$failed ${code}:${level}"
            done
          done
          [ -z "$failed" ] || { echo "resend failed:$failed"; exit 1; }
