# 사람이 직접 main 에 push 한 변경(디자인, 도구, 랜딩 등)을 Pages 에 배포한다.
# 발행 워크플로(publish, weekly, backfill-word-audio)는 GITHUB_TOKEN 으로 push 하므로 이 워크플로를 깨우지 않는다
# (GitHub 는 GITHUB_TOKEN push 로 다른 워크플로를 띄우지 않는다). 그쪽은 같은 job 안에서 직접 배포한다.
name: pages

on:
  push:
    branches: [main]
    # 지문 push 는 publish.yml, de-audio.yml 이 페이지를 만든 뒤 배포한다. 여기서 먼저 배포할 필요가 없다.
    paths-ignore:
      - "content/**"
      - "pool/**"
  workflow_dispatch:

# publish 그룹에 넣지 않는다: 같은 그룹의 대기 실행은 새 실행이 오면 취소되어 메일이 걸린 발행이 빠질 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 트리거 커밋이 아니라 지금의 main 을 배포한다(대기하는 사이 발행 커밋이 올라와도 되돌리지 않게).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare site
        run: python tools/prepare_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy pages
        id: deploy
        uses: actions/deploy-pages@v4
