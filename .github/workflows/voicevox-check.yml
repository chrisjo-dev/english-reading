# 일회성 점검: VOICEVOX 엔진으로 일본어 음성 샘플을 만든다. 결과는 아티팩트 voicevox-samples.
name: voicevox-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Wait for engine
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:50021/version && break; sleep 5; done
          curl -s http://localhost:50021/speakers | python3 -c "import json,sys; [print(s['name'], [(x['name'], x['id']) for x in s['styles']]) for s in json.load(sys.stdin)]" | head -30
      - name: Synthesize
        run: |
          mkdir out
          for sp in 14 8 13; do
            n=0
            for text in "わたしの家の近くに、小さいパン屋があります。" "先週の土曜日、友だちと二人で朝七時に買いに行きました。"; do
              n=$((n+1))
              q=$(curl -s -X POST "http://localhost:50021/audio_query?speaker=$sp" --get --data-urlencode "text=$text")
              echo "$q" | python3 -c "import json,sys; d=json.load(sys.stdin); d['speedScale']=0.9; print(json.dumps(d))" > q.json
              curl -s -X POST "http://localhost:50021/synthesis?speaker=$sp" -H 'Content-Type: application/json' --data-binary @q.json -o out/sp${sp}_s${n}.wav
              ffmpeg -y -loglevel error -i out/sp${sp}_s${n}.wav -ac 1 -b:a 96k out/sp${sp}_s${n}.mp3 && rm out/sp${sp}_s${n}.wav
            done
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: voicevox-samples
          path: out/*.mp3
