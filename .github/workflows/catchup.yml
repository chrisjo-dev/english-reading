name: catchup

# 그날 메일을 받지 못한 구독자(구독 언어 누락, 아침 발송 뒤 구독 등)에게만 같은 지문을 다시 보낸다.
# 매일 08:00 KST에 그날 모든 언어를 보충한다. 아침 본 메일(06:4x~06:5x)의 전달 기록이 쌓인 뒤라 이미 받은 사람에게는 다시 가지 않는다.
# 지난 날짜나 특정 언어만 보충할 때는 수동 실행에 lang, day 를 넣는다.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "언어 코드 (en, ja)"
        required: true
      day:
        description: "날짜 YYYY-MM-DD"
        required: true

# 저장소에 쓰지 않으므로 읽기 권한만 준다.
permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send to missed subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LANG_CODE: ${{ inputs.lang }}
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$LANG_CODE" ]; then
            codes="$LANG_CODE"; day="$DAY"
          else
            codes=$(python -c "import sys; sys.path.insert(0, 'tools'); import langs; print(' '.join(langs.LANGS))")
            day=$(TZ=Asia/Seoul date +%F)
          fi
          # 한 언어가 실패해도(예: 그날 본 메일이 없음) 나머지 언어는 보충하고, 끝에 실패로 드러낸다.
          failed=""
          for code in $codes; do
            python tools/send_email.py "$code" "$day" --catchup || failed="$failed $code"
          done
          [ -z "$failed" ] || { echo "catch-up failed:$failed"; exit 1; }
