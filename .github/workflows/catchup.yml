name: catchup

# 그날 메일을 받지 못한 구독자(구독 언어 누락, 아침 발송 뒤 구독 등)에게만 같은 지문을 다시 보낸다.
# 매일 08:00 KST에 그날 모든 언어를 보충한다. 아침 본 메일(06:4x~06:5x)의 전달 기록이 쌓인 뒤라 이미 받은 사람에게는 다시 가지 않는다.
# 수동 실행도 된다. 칸을 비우면 오늘 모든 언어, lang 이나 day 를 넣으면 그 언어나 날짜만 보충한다.
on:
  schedule:
    - cron: "0 23 * * *"
    # 예비 슬롯(08:30 KST). 이미 보충했으면 대상이 없어 아무것도 보내지 않는다.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "언어 코드 (en, ja). 비우면 모든 언어"
        required: false
      day:
        description: "날짜 YYYY-MM-DD. 비우면 오늘(KST)"
        required: false

# 저장소에 쓰지 않으므로 읽기 권한만 준다.
permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send to missed subscribers
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LANG_CODE: ${{ inputs.lang }}
          DAY: ${{ inputs.day }}
        run: |
          codes="$LANG_CODE"
          [ -n "$codes" ] || codes=$(python -c "import sys; sys.path.insert(0, 'tools'); import langs; print(' '.join(langs.LANGS))")
          day="$DAY"
          [ -n "$day" ] || day=$(TZ=Asia/Seoul date +%F)
          echo "catch-up: $codes $day"
          # 한 언어가 실패해도(예: 그날 본 메일이 없음) 나머지 언어는 보충하고, 끝에 실패로 드러낸다.
          failed=""
          for code in $codes; do
            python tools/send_email.py "$code" "$day" --catchup || failed="$failed $code"
          done
          [ -z "$failed" ] || { echo "catch-up failed:$failed"; exit 1; }
