# 일요일 아침, 언어마다 그 주(오늘 포함 7일)의 주요 단어로 복습 페이지를 만들고 그 언어 구독자에게 메일을 보낸다.
name: weekly

on:
  schedule:
    - cron: "30 23 * * 6"   # 일요일 08:30 KST
  workflow_dispatch:
    inputs:
      day:
        description: "복습 기준일 YYYY-MM-DD (그날 포함 7일)"
        required: true
      lang:
        description: "언어 코드 (비우면 전체)"
        required: false
        default: ""
      send:
        description: "오늘 날짜가 아니어도 메일 발송"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write   # deploy-pages(OIDC)

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # deploy-pages 는 github-pages 환경에서 도는 job 에서만 배포할 수 있다.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick day
        id: day
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          day="${{ inputs.day }}"
          [ -n "$day" ] || day=$today
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q pillow

      - name: Build review pages
        id: build
        run: |
          built=
          langs="${{ inputs.lang }}"
          [ -n "$langs" ] || langs=$(python -c "import sys; sys.path.insert(0, 'tools'); import langs; print(' '.join(langs.LANGS))")
          for lang in $langs; do
            # 그 주에 지문이 하나도 없는 언어는 건너뛴다(weekly.py 가 실패로 끝남).
            if python tools/weekly.py $lang ${{ steps.day.outputs.day }}; then
              python -c "import sys; sys.path.insert(0, 'tools'); import publish; publish.rebuild_lists('$lang')"
              built="$built $lang"
            fi
          done
          echo "langs=$built" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # models/ 는 .gitignore 로 제외된다
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Weekly review ${{ steps.day.outputs.day }}"
          git push || { git pull --rebase origin main && git push; }
        env:
          GH_TOKEN: ${{ github.token }}

      # 허용 목록 파일만 artifact 로 올려 배포한다(content/, pool/, tools/ 등은 사이트에 올라가지 않는다).
      # 배포 뒤에 메일을 보내야 wait_live 가 새 페이지를 본다. 배포가 실패해도(branch 배포로 되돌린 경우 포함) 아래 대체 단계로 이어 간다.
      - name: Prepare site
        # 실패해도 메일은 보낸다: 업로드와 배포가 건너뛰어지고 아래 대체 빌드가 돈다
        continue-on-error: true
        run: python tools/prepare_site.py

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

      - name: Deploy pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fallback pages build
        # Actions 배포가 실패하면 branch 배포 빌드를 직접 요청한다(GITHUB_TOKEN push 는 Pages 빌드를 보장하지 않는다).
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::warning::deploy-pages 실패(${{ steps.deploy.outcome }}): branch 배포 빌드를 요청합니다"
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Send email
        if: steps.day.outputs.day == steps.day.outputs.today || inputs.send
        run: |
          for lang in ${{ steps.build.outputs.langs }}; do
            python tools/send_email.py $lang ${{ steps.day.outputs.day }} --weekly
          done
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
