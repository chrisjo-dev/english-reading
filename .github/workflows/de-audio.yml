# content/de/**.json 이 push 되면 Qwen3-TTS(CPU) 로 독일어 음성을 만들고
# 완료 후 publish.yml 을 dispatch 해 페이지를 빌드한다(이슈 #9).
# publish 의 concurrency 그룹(publish)과 별개로 de-audio 그룹에서 직렬 처리한다.
name: de-audio

on:
  push:
    branches: [main]
    paths: ["content/de/**.json"]
  workflow_dispatch:
    inputs:
      day:
        description: "YYYY-MM-DD (비우면 push 에서 감지)"
        required: true

concurrency:
  group: de-audio
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # gh workflow run publish.yml 에 필요

env:
  MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  # 모델 캐시는 저장소 밖에 둔다(저장소 안에 두면 커밋에 4GB 모델이 섞여 push 가 실패한다)
  HF_HOME: /home/runner/.cache/hf-qwen
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          ref: main

      - name: Pick day(s)
        id: pick
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            days="${{ inputs.day }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            git cat-file -e "$base" 2>/dev/null || base="${head}^"
            days=$(git diff --name-only --diff-filter=AM -M "$base" "$head" -- content/de/ \
              | sed -nE 's#^content/de/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$#\1#p' \
              | sort -u | tr '\n' ' ')
          fi
          [ -n "${days// /}" ] || { echo "no de content change"; exit 1; }
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "de 오디오 생성 대상: $days"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/de-audio.yml

      - name: Cache HF models
        id: hfcache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/hf-qwen
          key: hf-${{ env.MODEL_ID }}-whisper-small-v1  # 검사 모델을 small 로 바꿔 캐시 키도 바꾼다(키가 맞으면 새 모델을 저장하지 않는다)

      - name: Install
        run: |
          t0=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts==0.1.1 faster-whisper soundfile
          echo "install_sec=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "hf_cache_hit=${{ steps.hfcache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
          nproc; free -g
          python -c "import torch; print('torch', torch.__version__, 'threads', torch.get_num_threads())"

      - name: Generate audio
        env:
          QWEN_MAX_RETRIES: "4"
        run: |
          t0=$(date +%s)
          for day in ${{ steps.pick.outputs.days }}; do
            echo "=== de $day 오디오 생성 ==="
            python tools/audio.py de "$day"
          done
          echo "audio_sec=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이 워크플로가 만드는 것은 de/<날짜>/audio 뿐이다. 그 밖의 파일은 커밋하지 않는다.
          git add -- de/*/audio
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "de 오디오 생성 ${{ steps.pick.outputs.days }} Refs #9"
          # 최대 3회 재시도: 거절되면 origin/main 으로 rebase 하고 생성 파일 충돌은 ours 로 해결한다.
          push_ok=0
          for attempt in 1 2 3; do
            if git push; then push_ok=1; break; fi
            echo "push attempt $attempt 실패; origin/main 으로 rebase..."
            git fetch origin main
            if git rebase origin/main; then continue; fi
            # rebase 충돌: de/*/audio/ 하위 생성 파일만 허용 (rebase 에서는 다시 얹는 우리 커밋이 theirs, 즉 방금 생성한 것)
            bad=$(git diff --name-only --diff-filter=U \
              | grep -vxE "de/[0-9]{4}-[0-9]{2}-[0-9]{2}/audio/.*\.mp3" || true)
            if [ -n "$bad" ]; then
              git rebase --abort
              echo "::error::생성 파일 외 rebase 충돌: $bad — 수동 해결 필요"
              exit 1
            fi
            git checkout --theirs -- $(git diff --name-only --diff-filter=U)
            git add -- de/*/audio
            if git diff --cached --quiet; then
              git rebase --skip
            else
              GIT_EDITOR=: git rebase --continue || {
                echo "::error::rebase --continue 실패"; git rebase --abort 2>/dev/null || true; exit 1
              }
            fi
          done
          [ $push_ok -eq 1 ] || { echo "::error::push 3회 모두 실패"; exit 1; }

      - name: Trigger publish
        # GITHUB_TOKEN 으로 보낸 workflow_dispatch 는 새 실행을 허용한다(push 와 달리).
        run: |
          for day in ${{ steps.pick.outputs.days }}; do
            if gh workflow run publish.yml \
                --field lang=de \
                --field day="$day"; then
              echo "publish.yml 트리거 성공: de $day"
            else
              echo "::warning::publish.yml 트리거 실패: de $day (수동으로 실행해 주세요)"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
