# content/<언어>/<오늘날짜>.json 이 없으면 pool 에서 비축분을 꺼내 publish 를 실행한다.
# 매일 07:15 KST(22:15 UTC)에 실행된다. 예약 작업이 늦어지거나 실패했을 때 자동으로 보정한다.
name: fallback

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "언어 코드 (en, ja). 비우면 모든 언어"
        required: false
      day:
        description: "날짜 YYYY-MM-DD. 비우면 오늘(KST)"
        required: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fallback
        id: fallback
        env:
          FALLBACK_LANG: ${{ inputs.lang }}
          FALLBACK_DAY: ${{ inputs.day }}
        run: |
          # 입력값을 안전하게 인수로 변환한다. ${{ }} 직접 삽입은 하지 않는다.
          args=""
          [ -n "$FALLBACK_LANG" ] && args="$args --lang $FALLBACK_LANG"
          [ -n "$FALLBACK_DAY" ] && args="$args --day $FALLBACK_DAY"

          # 결과를 파일로 받아서 파싱한다
          python tools/fallback.py $args | tee /tmp/fallback_out.txt
          exit_code=${PIPESTATUS[0]}

          # USED 줄 파싱
          used_pairs=""
          while IFS= read -r line; do
            if [[ "$line" == USED\ * ]]; then
              arr=($line)
              # arr[0]=USED arr[1]=lang arr[2]=day arr[3]=pool-file arr[4]=remaining
              used_pairs="$used_pairs ${arr[1]}:${arr[2]}"
              echo "used_${arr[1]}=${arr[2]}" >> "$GITHUB_OUTPUT"
              echo "remaining_${arr[1]}=${arr[4]}" >> "$GITHUB_OUTPUT"
            fi
          done < /tmp/fallback_out.txt

          used_pairs="${used_pairs# }"
          echo "used_pairs=$used_pairs" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.fallback.outputs.used_pairs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          pairs="${{ steps.fallback.outputs.used_pairs }}"
          msg="Fallback publish"
          for pair in $pairs; do
            lang="${pair%%:*}"; day="${pair#*:}"
            msg="$msg ${lang}:${day} from pool"
          done
          git commit -m "$msg"
          git push || { git pull --rebase origin main && git push; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger publish
        if: steps.fallback.outputs.used_pairs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in ${{ steps.fallback.outputs.used_pairs }}; do
            lang="${pair%%:*}"; day="${pair#*:}"
            echo "publish 트리거: $lang $day"
            gh workflow run publish.yml -f lang="$lang" -f day="$day"
          done

      - name: Open issues for used langs
        if: steps.fallback.outputs.used_pairs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in ${{ steps.fallback.outputs.used_pairs }}; do
            lang="${pair%%:*}"; day="${pair#*:}"
            # remaining 값 파싱 (각 언어별로 저장된 output 읽기)
            remaining_var="remaining_${lang}"
            remaining="${{ steps.fallback.outputs[env.remaining_var] }}"
            # GITHUB_OUTPUT 환경 변수에서 동적으로 읽기 어려우므로 /tmp/fallback_out.txt 에서 파싱
            remaining=$(grep "^USED $lang " /tmp/fallback_out.txt | awk '{print $5}')

            title="[비상 발행] $day $lang: 비축분 사용 (남은 ${remaining}개)"
            body="@chrisjo-dev

            **$lang** 언어의 오늘($day) 예약 발행 루틴이 실행되지 않아 비축분(pool)을 사용했습니다.

            **확인할 곳:**
            - claude.ai 예약 작업 실행 로그 (루틴 실패 여부)
            - [publish 워크플로 실행 목록](../../actions/workflows/publish.yml)

            **비축분 보충이 필요합니다.** \`tools/ROUTINE.pool.md\` 절차를 따라 pool 을 채워 주세요.

            남은 비축분: **${remaining}개**"

            # 같은 제목의 열린 이슈가 있으면 중복 생성하지 않는다
            existing=$(gh issue list --search "$title" --state open --json number --jq 'length')
            if [ "$existing" -eq 0 ]; then
              gh issue create --title "$title" --body "$body"
            else
              echo "이미 열린 이슈가 있어 건너뜀: $title"
            fi

            # 비축분 부족 경고 이슈
            if [ "$remaining" -lt 5 ] && [ "$remaining" -gt 0 ]; then
              low_title="[비축 부족] $lang 남은 ${remaining}개"
              existing_low=$(gh issue list --search "$low_title" --state open --json number --jq 'length')
              if [ "$existing_low" -eq 0 ]; then
                gh issue create --title "$low_title" \
                  --body "@chrisjo-dev pool/$lang/ 비축분이 ${remaining}개 남았습니다. \`tools/ROUTINE.pool.md\` 절차로 보충해 주세요."
              fi
            fi
          done

      - name: Open empty pool issue and fail
        if: steps.fallback.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="${FALLBACK_DAY:-$(TZ=Asia/Seoul date +%F)}"
          while IFS= read -r line; do
            if [[ "$line" == EMPTY\ * ]]; then
              lang="${line#EMPTY }"
              lang="${lang%% *}"
              title="[긴급] $lang 비축분 없음"
              existing=$(gh issue list --search "$title" --state open --json number --jq 'length')
              if [ "$existing" -eq 0 ]; then
                gh issue create --title "$title" \
                  --body "@chrisjo-dev **$lang** 비축분이 완전히 소진됐습니다. 즉시 \`tools/ROUTINE.pool.md\` 절차로 보충이 필요합니다."
              fi
            fi
          done < /tmp/fallback_out.txt
          exit 1
        env:
          FALLBACK_DAY: ${{ inputs.day }}
